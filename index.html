<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Furniture Telegram Mini App</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            orange: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            },
            tg: {
              bg: 'var(--tg-theme-bg-color, #ffffff)',
              text: 'var(--tg-theme-text-color, #111827)',
              hint: 'var(--tg-theme-hint-color, #9ca3af)',
              link: 'var(--tg-theme-link-color, #ea580c)',
              button: 'var(--tg-theme-button-color, #ea580c)',
              buttonText: 'var(--tg-theme-button-text-color, #ffffff)',
              secondaryBg: 'var(--tg-theme-secondary-bg-color, #f9fafb)',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: var(--tg-theme-secondary-bg-color, #f9fafb);
      color: var(--tg-theme-text-color, #111827);
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    [contenteditable="true"]:focus {
      outline: 2px solid #ea580c;
      background-color: rgba(234, 88, 12, 0.05);
      border-radius: 6px;
    }

    .active-scale:active {
      transform: scale(0.96);
    }

    .sheet-transition {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans pb-24 antialiased">

  <!-- ==================== TOP NAVIGATION / HEADER ==================== -->
  <header class="sticky top-0 z-30 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md border-b border-orange-100 dark:border-gray-800 px-4 py-3 shadow-sm">
    <div class="flex items-center justify-between gap-3 max-w-md mx-auto">
      
      <!-- TG User Profile Info -->
      <div class="flex items-center gap-2.5">
        <div id="userAvatar" class="w-9 h-9 rounded-full bg-gradient-to-tr from-orange-500 to-amber-400 text-white flex items-center justify-center font-bold text-sm shadow-md">
          U
        </div>
        <div class="flex flex-col">
          <span id="userName" class="text-xs font-bold text-gray-900 dark:text-white leading-tight truncate max-w-[130px]">
            Hello, Guest
          </span>
          <span class="text-[10px] text-orange-600 font-medium flex items-center gap-1">
            <i class="fa-solid fa-bolt text-[9px]"></i> Telegram Mini App
          </span>
        </div>
      </div>

      <!-- Actions: Favorite & Cart Indicator -->
      <div class="flex items-center gap-2">
        <button onclick="toggleFavoritesFilter()" id="favToggleBtn" class="w-9 h-9 rounded-full bg-orange-50 text-gray-700 flex items-center justify-center relative active-scale transition-colors">
          <i id="favIcon" class="fa-regular fa-heart text-sm"></i>
          <span id="favBadge" class="hidden absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </button>

        <button onclick="openCartSheet()" class="w-9 h-9 rounded-full bg-orange-500 text-white flex items-center justify-center relative active-scale shadow-md shadow-orange-500/20">
          <i class="fa-solid fa-bag-shopping text-sm"></i>
          <span id="cartBadge" class="absolute -top-1 -right-1 bg-gray-900 text-white text-[9px] font-extrabold px-1.5 py-0.2 min-w-[16px] h-4 rounded-full flex items-center justify-center">0</span>
        </button>
      </div>
    </div>

    <!-- Live Search Bar -->
    <div class="mt-2.5 max-w-md mx-auto relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
      <input 
        type="text" 
        id="searchInput"
        placeholder="Search furniture, tables, chairs..." 
        class="w-full bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white rounded-full pl-9 pr-8 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-orange-500 transition-all placeholder:text-gray-400"
        oninput="handleSearch()"
      >
      <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Category Pills Bar -->
    <div class="mt-2.5 flex items-center gap-2 overflow-x-auto no-scrollbar py-1 max-w-md mx-auto" id="categoryContainer">
      <!-- Dynamic Categories -->
    </div>
  </header>


  <!-- ==================== MAIN CONTENT CATALOG ==================== -->
  <main class="flex-grow px-4 pt-4 max-w-md mx-auto w-full space-y-4">
    
    <!-- Hero Editable Promo Banner -->
    <div class="relative rounded-2xl overflow-hidden bg-gradient-to-r from-orange-600 to-amber-500 p-4 text-white shadow-lg shadow-orange-500/15">
      <div class="relative z-10 max-w-[70%] space-y-1">
        <span class="inline-block bg-white/20 backdrop-blur-md text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
          Telegram Special
        </span>
        <h2 contenteditable="true" onblur="triggerHaptic('light')" class="font-display font-extrabold text-lg leading-tight focus:bg-white/20 p-0.5">
          Modern Living 2026 Collection
        </h2>
        <p contenteditable="true" onblur="triggerHaptic('light')" class="text-[11px] text-orange-100 opacity-90 line-clamp-2 focus:bg-white/20 p-0.5">
          Tap any text or element to live-edit items in this Telegram app!
        </p>
      </div>
      <i class="fa-solid fa-couch absolute -right-3 -bottom-3 text-7xl text-white/20 rotate-[-10deg]"></i>
    </div>

    <!-- Admin Controls Bar: Add New Item -->
    <div class="flex items-center justify-between pt-1">
      <div class="flex items-center gap-2">
        <h3 class="font-display font-bold text-sm text-gray-900 dark:text-white">Catalog</h3>
        <span id="catalogCount" class="text-[10px] text-gray-400 font-medium">(0 items)</span>
      </div>

      <button onclick="addNewFurnitureItem()" class="bg-orange-100 dark:bg-gray-800 text-orange-600 dark:text-orange-400 hover:bg-orange-200 px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1 active-scale transition-colors">
        <i class="fa-solid fa-plus text-[10px]"></i>
        <span>Add Furniture</span>
      </button>
    </div>

    <!-- Furniture Cards Grid -->
    <div id="productGrid" class="grid grid-cols-2 gap-3">
      <!-- Dynamic Furniture Items Injected Here -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden py-12 text-center space-y-3">
      <div class="w-12 h-12 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-chair"></i>
      </div>
      <p class="text-xs font-semibold text-gray-700 dark:text-gray-300">No furniture found</p>
      <button onclick="resetFilters()" class="text-xs text-orange-600 font-bold underline">Reset Filters</button>
    </div>
  </main>


  <!-- ==================== CUSTOMIZER / QUICK ORDER BOTTOM SHEET ==================== -->
  <div id="customizerSheet" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-xs" onclick="closeCustomizerSheet()"></div>
    
    <div class="absolute inset-x-0 bottom-0 bg-white dark:bg-gray-900 rounded-t-3xl max-h-[90vh] flex flex-col sheet-transition shadow-2xl max-w-md mx-auto">
      
      <!-- Sheet Handle Bar -->
      <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full mx-auto my-3 shrink-0"></div>

      <!-- Content Scroll -->
      <div class="overflow-y-auto px-5 pb-6 space-y-4 flex-1">
        
        <div class="flex gap-3">
          <img id="sheetImg" src="" class="w-24 h-24 object-cover rounded-2xl bg-gray-100 border border-gray-200 shrink-0">
          <div class="space-y-1 flex-1 min-w-0">
            <span id="sheetCategory" contenteditable="true" class="text-[10px] font-extrabold text-orange-500 uppercase tracking-wider block"></span>
            <h3 id="sheetTitle" contenteditable="true" class="font-display font-bold text-base text-gray-900 dark:text-white truncate"></h3>
            <p id="sheetDesc" contenteditable="true" class="text-[11px] text-gray-500 leading-tight line-clamp-2"></p>
            <div class="text-base font-extrabold text-orange-600 pt-1" id="sheetBasePrice"></div>
          </div>
        </div>

        <hr class="border-gray-100 dark:border-gray-800">

        <!-- Materials / Colors -->
        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label class="text-xs font-bold text-gray-900 dark:text-white uppercase tracking-wider">
              1. Material & Color
            </label>
            <button onclick="addMaterialOption()" class="text-[10px] text-orange-600 font-bold flex items-center gap-0.5">
              <i class="fa-solid fa-plus text-[9px]"></i> Add Color
            </button>
          </div>
          <div class="flex flex-wrap gap-2" id="materialContainer"></div>
        </div>

        <!-- Variants / Sizes -->
        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label class="text-xs font-bold text-gray-900 dark:text-white uppercase tracking-wider">
              2. Size & Variant
            </label>
            <button onclick="addVariantOption()" class="text-[10px] text-orange-600 font-bold flex items-center gap-0.5">
              <i class="fa-solid fa-plus text-[9px]"></i> Add Size
            </button>
          </div>
          <div class="grid grid-cols-2 gap-2" id="variantContainer"></div>
        </div>

        <!-- Quantity Picker -->
        <div class="flex items-center justify-between bg-orange-50 dark:bg-gray-800 p-3 rounded-2xl border border-orange-100 dark:border-gray-700">
          <span class="text-xs font-bold text-gray-800 dark:text-gray-200">Quantity</span>
          <div class="flex items-center gap-3">
            <button onclick="updateSheetQty(-1)" class="w-7 h-7 rounded-lg bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 flex items-center justify-center font-bold text-gray-800 dark:text-white active-scale">
              <i class="fa-solid fa-minus text-[10px]"></i>
            </button>
            <span id="sheetQty" class="font-extrabold text-sm text-gray-900 dark:text-white min-w-[16px] text-center">1</span>
            <button onclick="updateSheetQty(1)" class="w-7 h-7 rounded-lg bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 flex items-center justify-center font-bold text-gray-800 dark:text-white active-scale">
              <i class="fa-solid fa-plus text-[10px]"></i>
            </button>
          </div>
        </div>

      </div>

      <!-- Action Footer -->
      <div class="p-4 bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 shrink-0">
        <button onclick="confirmAddToCart()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-orange-500/25 active-scale flex items-center justify-center gap-2 text-xs">
          <i class="fa-solid fa-cart-plus text-sm"></i>
          <span>Add to Order • <span id="sheetCalculatedTotal">$0</span></span>
        </button>
      </div>

    </div>
  </div>


  <!-- ==================== CART SHEET ==================== -->
  <div id="cartSheet" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-xs" onclick="closeCartSheet()"></div>
    
    <div class="absolute inset-x-0 bottom-0 bg-white dark:bg-gray-900 rounded-t-3xl max-h-[85vh] flex flex-col sheet-transition shadow-2xl max-w-md mx-auto">
      
      <!-- Handle -->
      <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full mx-auto my-3 shrink-0"></div>

      <div class="px-5 pb-3 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between shrink-0">
        <h3 class="font-display font-extrabold text-base text-gray-900 dark:text-white flex items-center gap-2">
          <i class="fa-solid fa-bag-shopping text-orange-500"></i>
          <span>Your Furniture Order</span>
        </h3>
        <button onclick="closeCartSheet()" class="text-xs text-gray-400 hover:text-gray-600">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- Items List -->
      <div class="overflow-y-auto p-5 space-y-3 flex-1" id="cartItemsList">
        <!-- Dynamic Cart Items -->
      </div>

      <div id="cartEmptyState" class="hidden py-8 text-center space-y-2">
        <p class="text-xs font-semibold text-gray-400">Your order list is empty.</p>
      </div>

      <!-- Order Summary -->
      <div class="p-5 bg-gray-50 dark:bg-gray-800/60 border-t border-gray-100 dark:border-gray-800 shrink-0 space-y-2">
        <div class="flex justify-between text-xs text-gray-500">
          <span>Subtotal</span>
          <span id="cartSubtotal" class="font-bold text-gray-800 dark:text-gray-200">$0.00</span>
        </div>
        <div class="flex justify-between text-xs text-gray-500">
          <span>Est. Delivery</span>
          <span id="cartDelivery" class="font-bold text-gray-800 dark:text-gray-200">$0.00</span>
        </div>
        <div class="flex justify-between text-sm font-extrabold text-gray-900 dark:text-white pt-1 border-t border-gray-200 dark:border-gray-700">
          <span>Total</span>
          <span id="cartTotal" class="text-orange-600 font-display">$0.00</span>
        </div>

        <!-- Custom Order Note -->
        <input 
          type="text" 
          id="orderNote" 
          placeholder="Special delivery instructions..." 
          class="w-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-orange-500 mt-2"
        />
      </div>

    </div>
  </div>


  <!-- ==================== JAVASCRIPT & TELEGRAM SDK INTEGRATION ==================== -->
  <script>
    // --- TELEGRAM WEB APP SDK INITIALIZATION ---
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
      tg.ready();
      tg.expand();
      tg.enableClosingConfirmation();
      try {
        tg.setHeaderColor('#ffffff');
        tg.setBackgroundColor('#f9fafb');
      } catch (e) {}
    }

    function triggerHaptic(style = 'medium') {
      if (tg && tg.HapticFeedback) {
        if (style === 'success' || style === 'warning' || style === 'error') {
          tg.HapticFeedback.notificationOccurred(style);
        } else {
          tg.HapticFeedback.impactOccurred(style);
        }
      }
    }

    // --- DATA MODEL ---
    let categories = ["All", "Seating", "Tables", "Bedroom", "Office", "Lighting"];
    
    let products = [
      {
        id: "p1",
        name: "Velvet Lounge Chair",
        category: "Seating",
        price: 349,
        rating: 4.9,
        tag: "Popular",
        image: "https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?auto=format&fit=crop&q=80&w=600",
        description: "Italian soft velvet cushion with ergonomic support & steel base.",
        materials: [
          { name: "Emerald Velvet", hex: "#2d5a43", extra: 0 },
          { name: "Oatmeal Bouclé", hex: "#ece6d8", extra: 25 },
          { name: "Charcoal", hex: "#262626", extra: 0 }
        ],
        variants: [
          { name: "Standard", modifier: 0, label: "Compact width" },
          { name: "Wide Lounge", modifier: 60, label: "+4 inch depth" }
        ]
      },
      {
        id: "p2",
        name: "Solid Oak Dining Table",
        category: "Tables",
        price: 799,
        rating: 4.8,
        tag: "Eco Wood",
        image: "https://images.unsplash.com/photo-1530018607912-eff2daa1bac4?auto=format&fit=crop&q=80&w=600",
        description: "Sustainably sourced white oak timber with natural oil matte finish.",
        materials: [
          { name: "Natural Oak", hex: "#d4b387", extra: 0 },
          { name: "Smoked Walnut", hex: "#5c4033", extra: 90 }
        ],
        variants: [
          { name: "6 Seater", modifier: 0, label: "160 cm" },
          { name: "8 Seater", modifier: 120, label: "200 cm" }
        ]
      },
      {
        id: "p3",
        name: "Architect Brass Lamp",
        category: "Lighting",
        price: 129,
        rating: 4.7,
        tag: "New",
        image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&q=80&w=600",
        description: "Dimmable warm LED desk lamp with 360-degree adjustable arm.",
        materials: [
          { name: "Brushed Brass", hex: "#cfab60", extra: 0 },
          { name: "Matte Black", hex: "#1f1f1f", extra: 0 }
        ],
        variants: [
          { name: "Plug-in", modifier: 0, label: "Standard cord" },
          { name: "Wireless Battery", modifier: 30, label: "12hr portable" }
        ]
      },
      {
        id: "p4",
        name: "Minimalist Oak Desk",
        category: "Office",
        price: 480,
        rating: 4.9,
        tag: "Studio",
        image: "https://images.unsplash.com/photo-1518455027359-f3f8164ba6bd?auto=format&fit=crop&q=80&w=600",
        description: "Clean aesthetic study desk with dual drawer wire organizer.",
        materials: [
          { name: "Birch", hex: "#e3cca8", extra: 0 },
          { name: "Walnut", hex: "#6e4d3b", extra: 40 }
        ],
        variants: [
          { name: "120 cm", modifier: 0, label: "Standard" },
          { name: "150 cm", modifier: 80, label: "Executive" }
        ]
      }
    ];

    // --- STATE ---
    let selectedCategory = "All";
    let searchQuery = "";
    let favorites = new Set();
    let favoritesOnly = false;
    let cart = [];

    // Customizer Modal State
    let activeProduct = null;
    let selectedMaterial = null;
    let selectedVariant = null;
    let customizerQty = 1;

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      initTGUser();
      renderCategories();
      renderProducts();
      updateCartUI();

      // Configure Native TG MainButton
      if (tg && tg.MainButton) {
        tg.MainButton.setText("VIEW ORDER");
        tg.MainButton.onClick(handleMainButtonClick);
      }
    });

    function initTGUser() {
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const u = tg.initDataUnsafe.user;
        const name = u.first_name ? `${u.first_name} ${u.last_name || ''}` : `@${u.username}`;
        document.getElementById('userName').textContent = name.trim();
        
        if (u.first_name) {
          document.getElementById('userAvatar').textContent = u.first_name.charAt(0).toUpperCase();
        }
      }
    }

    // --- CATEGORY RENDERING ---
    function renderCategories() {
      const container = document.getElementById('categoryContainer');
      container.innerHTML = categories.map((cat, idx) => {
        const isActive = cat === selectedCategory;
        const activeClass = isActive 
          ? 'bg-orange-500 text-white font-bold shadow-sm' 
          : 'bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700 font-medium';
        return `
          <button 
            onclick="selectCategory('${cat}')" 
            class="px-3 py-1 rounded-full text-xs transition-all whitespace-nowrap active-scale shrink-0 ${activeClass}"
          >
            <span contenteditable="true" onblur="updateCategoryName(${idx}, this.innerText)" onclick="event.stopPropagation()">${cat}</span>
          </button>
        `;
      }).join('') + `
        <button onclick="addNewCategory()" class="px-2.5 py-1 rounded-full text-xs bg-orange-50 text-orange-600 font-bold border border-orange-200 flex items-center gap-1 shrink-0 active-scale">
          <i class="fa-solid fa-plus text-[10px]"></i> Add
        </button>
      `;
    }

    function selectCategory(cat) {
      triggerHaptic('light');
      selectedCategory = cat;
      renderCategories();
      renderProducts();
    }

    function updateCategoryName(index, newName) {
      if (newName.trim()) {
        categories[index] = newName.trim();
      }
    }

    function addNewCategory() {
      triggerHaptic('medium');
      const name = prompt("Enter new category name:");
      if (name && name.trim()) {
        categories.push(name.trim());
        renderCategories();
      }
    }

    // --- PRODUCT GRID RENDERING ---
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const emptyState = document.getElementById('emptyState');

      const filtered = products.filter(p => {
        const matchCat = selectedCategory === "All" || p.category === selectedCategory;
        const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                            p.description.toLowerCase().includes(searchQuery.toLowerCase());
        const matchFav = !favoritesOnly || favorites.has(p.id);
        return matchCat && matchSearch && matchFav;
      });

      document.getElementById('catalogCount').textContent = `(${filtered.length} items)`;

      if (filtered.length === 0) {
        grid.innerHTML = "";
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.innerHTML = filtered.map((p) => {
        const isFav = favorites.has(p.id);
        return `
          <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 overflow-hidden shadow-xs flex flex-col justify-between relative group">
            
            <!-- Item Image & Actions -->
            <div class="relative aspect-square bg-gray-100 dark:bg-gray-900 overflow-hidden">
              <img src="${p.image}" class="w-full h-full object-cover">
              
              <!-- Favorite Button -->
              <button onclick="toggleFav(event, '${p.id}')" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-white/80 dark:bg-gray-900/80 backdrop-blur-md flex items-center justify-center text-gray-700 dark:text-gray-200 active-scale shadow-sm">
                <i class="${isFav ? 'fa-solid text-rose-500' : 'fa-regular'} fa-heart text-xs"></i>
              </button>

              <!-- Delete Button -->
              <button onclick="deleteProduct(event, '${p.id}')" class="absolute top-2 left-2 w-7 h-7 rounded-full bg-rose-500/80 text-white flex items-center justify-center active-scale shadow-sm">
                <i class="fa-solid fa-trash-can text-[10px]"></i>
              </button>

              <!-- Editable Tag -->
              <span contenteditable="true" onblur="updateProductProp('${p.id}', 'tag', this.innerText)" class="absolute bottom-2 left-2 bg-gray-900/80 backdrop-blur-md text-white text-[8px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
                ${p.tag}
              </span>
            </div>

            <!-- Card Info -->
            <div class="p-2.5 flex-1 flex flex-col justify-between space-y-1.5">
              <div>
                <h4 contenteditable="true" onblur="updateProductProp('${p.id}', 'name', this.innerText)" class="font-display font-bold text-xs text-gray-900 dark:text-white leading-tight focus:bg-orange-50">
                  ${p.name}
                </h4>
                <p contenteditable="true" onblur="updateProductProp('${p.id}', 'description', this.innerText)" class="text-[10px] text-gray-400 line-clamp-1 mt-0.5">
                  ${p.description}
                </p>
              </div>

              <div class="flex items-center justify-between pt-1 border-t border-gray-100 dark:border-gray-700">
                <div class="font-extrabold text-xs text-orange-600 flex items-center">
                  $ <span contenteditable="true" onblur="updateProductProp('${p.id}', 'price', parseFloat(this.innerText) || 0)">${p.price}</span>
                </div>

                <button onclick="openCustomizer('${p.id}')" class="bg-orange-500 text-white px-2.5 py-1 rounded-lg text-[10px] font-bold active-scale shadow-sm flex items-center gap-1">
                  <i class="fa-solid fa-sliders text-[9px]"></i> Order
                </button>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    function updateProductProp(id, prop, value) {
      triggerHaptic('light');
      const p = products.find(item => item.id === id);
      if (p) {
        p[prop] = value;
      }
    }

    function addNewFurnitureItem() {
      triggerHaptic('medium');
      const newId = 'p' + (products.length + 1);
      products.unshift({
        id: newId,
        name: "New Lounge Chair",
        category: selectedCategory === "All" ? "Seating" : selectedCategory,
        price: 299,
        rating: 5.0,
        tag: "New",
        image: "https://images.unsplash.com/photo-1580481072645-022f9a6d1270?auto=format&fit=crop&q=80&w=600",
        description: "Custom editable seating item created inside Telegram.",
        materials: [{ name: "Standard Fabric", hex: "#ea580c", extra: 0 }],
        variants: [{ name: "Standard Size", modifier: 0, label: "Regular" }]
      });
      renderProducts();
    }

    function deleteProduct(e, id) {
      e.stopPropagation();
      triggerHaptic('warning');
      products = products.filter(p => p.id !== id);
      renderProducts();
    }

    // --- SEARCH & FAVORITES ---
    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim();
      document.getElementById('clearSearchBtn').classList.toggle('hidden', searchQuery.length === 0);
      renderProducts();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = "";
      searchQuery = "";
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderProducts();
    }

    function toggleFav(e, id) {
      e.stopPropagation();
      triggerHaptic('light');
      if (favorites.has(id)) favorites.delete(id);
      else favorites.add(id);

      const badge = document.getElementById('favBadge');
      badge.textContent = favorites.size;
      badge.classList.toggle('hidden', favorites.size === 0);
      renderProducts();
    }

    function toggleFavoritesFilter() {
      triggerHaptic('medium');
      favoritesOnly = !favoritesOnly;
      const btn = document.getElementById('favToggleBtn');
      const icon = document.getElementById('favIcon');
      btn.classList.toggle('bg-rose-100', favoritesOnly);
      icon.classList.toggle('text-rose-600', favoritesOnly);
      renderProducts();
    }

    function resetFilters() {
      selectedCategory = "All";
      searchQuery = "";
      favoritesOnly = false;
      document.getElementById('searchInput').value = "";
      renderCategories();
      renderProducts();
    }


    // --- CUSTOMIZER SHEET LOGIC ---
    function openCustomizer(id) {
      triggerHaptic('medium');
      activeProduct = products.find(p => p.id === id);
      if (!activeProduct) return;

      selectedMaterial = activeProduct.materials[0];
      selectedVariant = activeProduct.variants[0];
      customizerQty = 1;

      document.getElementById('sheetImg').src = activeProduct.image;
      document.getElementById('sheetCategory').textContent = activeProduct.category;
      document.getElementById('sheetTitle').textContent = activeProduct.name;
      document.getElementById('sheetDesc').textContent = activeProduct.description;
      document.getElementById('sheetBasePrice').textContent = `$${activeProduct.price}`;
      document.getElementById('sheetQty').textContent = customizerQty;

      renderMaterials();
      renderVariants();
      updateSheetTotal();

      document.getElementById('customizerSheet').classList.remove('hidden');

      if (tg && tg.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(closeCustomizerSheet);
      }
    }

    function closeCustomizerSheet() {
      triggerHaptic('light');
      document.getElementById('customizerSheet').classList.add('hidden');
      if (tg && tg.BackButton) tg.BackButton.hide();
    }

    function renderMaterials() {
      const container = document.getElementById('materialContainer');
      container.innerHTML = activeProduct.materials.map((m, idx) => {
        const isSel = selectedMaterial.name === m.name;
        const activeStyle = isSel ? 'ring-2 ring-orange-500 border-orange-500 font-bold' : 'border-gray-200 dark:border-gray-700';
        return `
          <button onclick="selectMaterial(${idx})" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border bg-white dark:bg-gray-800 text-[11px] text-gray-800 dark:text-gray-200 ${activeStyle} active-scale">
            <span class="w-3.5 h-3.5 rounded-full border border-black/10" style="background-color: ${m.hex}"></span>
            <span contenteditable="true" onblur="m.name = this.innerText">${m.name}</span>
            ${m.extra > 0 ? `<span class="text-orange-600 font-bold">+$${m.extra}</span>` : ''}
          </button>
        `;
      }).join('');
    }

    function selectMaterial(idx) {
      triggerHaptic('light');
      selectedMaterial = activeProduct.materials[idx];
      renderMaterials();
      updateSheetTotal();
    }

    function addMaterialOption() {
      triggerHaptic('medium');
      const name = prompt("Material/Color name:");
      if (name) {
        activeProduct.materials.push({ name, hex: "#ea580c", extra: 15 });
        renderMaterials();
      }
    }

    function renderVariants() {
      const container = document.getElementById('variantContainer');
      container.innerHTML = activeProduct.variants.map((v, idx) => {
        const isSel = selectedVariant.name === v.name;
        const activeStyle = isSel ? 'border-orange-500 bg-orange-50/50 dark:bg-gray-800' : 'border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800';
        return `
          <button onclick="selectVariant(${idx})" class="p-2 rounded-xl border text-left ${activeStyle} active-scale">
            <div contenteditable="true" onblur="v.name = this.innerText" class="text-xs font-bold text-gray-900 dark:text-white">${v.name}</div>
            <div class="text-[9px] text-orange-600 font-bold mt-0.5">${v.modifier > 0 ? `+$${v.modifier}` : 'Included'}</div>
          </button>
        `;
      }).join('');
    }

    function selectVariant(idx) {
      triggerHaptic('light');
      selectedVariant = activeProduct.variants[idx];
      renderVariants();
      updateSheetTotal();
    }

    function addVariantOption() {
      triggerHaptic('medium');
      const name = prompt("Variant/Size name:");
      if (name) {
        activeProduct.variants.push({ name, modifier: 30, label: "Custom size" });
        renderVariants();
      }
    }

    function updateSheetQty(delta) {
      const next = customizerQty + delta;
      if (next >= 1 && next <= 15) {
        triggerHaptic('light');
        customizerQty = next;
        document.getElementById('sheetQty').textContent = customizerQty;
        updateSheetTotal();
      }
    }

    function updateSheetTotal() {
      const unit = activeProduct.price + (selectedMaterial ? selectedMaterial.extra : 0) + (selectedVariant ? selectedVariant.modifier : 0);
      const total = unit * customizerQty;
      document.getElementById('sheetCalculatedTotal').textContent = `$${total}`;
    }

    function confirmAddToCart() {
      triggerHaptic('success');
      const unit = activeProduct.price + (selectedMaterial ? selectedMaterial.extra : 0) + (selectedVariant ? selectedVariant.modifier : 0);
      
      cart.push({
        id: Date.now(),
        product: activeProduct,
        material: selectedMaterial,
        variant: selectedVariant,
        quantity: customizerQty,
        unitPrice: unit,
        totalPrice: unit * customizerQty
      });

      updateCartUI();
      closeCustomizerSheet();
      
      if (tg && tg.showAlert) {
        tg.showAlert(`Added ${customizerQty}x ${activeProduct.name} to your Telegram furniture order!`);
      }
    }


    // --- CART DRAWER & MAINBUTTON LOGIC ---
    function updateCartUI() {
      const badge = document.getElementById('cartBadge');
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      badge.textContent = totalCount;

      const subtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
      const delivery = subtotal > 0 ? 35 : 0;
      const total = subtotal + delivery;

      document.getElementById('cartSubtotal').textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById('cartDelivery').textContent = `$${delivery.toFixed(2)}`;
      document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;

      if (tg && tg.MainButton) {
        if (cart.length > 0) {
          tg.MainButton.setText(`CHECKOUT ORDER ($${total.toFixed(2)})`);
          tg.MainButton.show();
        } else {
          tg.MainButton.hide();
        }
      }

      renderCartItems();
    }

    function renderCartItems() {
      const container = document.getElementById('cartItemsList');
      const emptyState = document.getElementById('cartEmptyState');

      if (cart.length === 0) {
        container.innerHTML = "";
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      container.innerHTML = cart.map((item, idx) => `
        <div class="flex items-center gap-3 p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700">
          <img src="${item.product.image}" class="w-12 h-12 rounded-lg object-cover bg-white">
          <div class="flex-1 min-w-0">
            <h5 class="font-bold text-xs text-gray-900 dark:text-white truncate">${item.product.name}</h5>
            <p class="text-[10px] text-gray-400">${item.material.name} • ${item.variant.name}</p>
            <span class="text-xs font-extrabold text-orange-600">$${item.totalPrice}</span>
          </div>

          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-gray-700 dark:text-gray-300">x${item.quantity}</span>
            <button onclick="removeCartItem(${idx})" class="text-rose-500 p-1">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function removeCartItem(idx) {
      triggerHaptic('warning');
      cart.splice(idx, 1);
      updateCartUI();
    }

    function openCartSheet() {
      triggerHaptic('medium');
      document.getElementById('cartSheet').classList.remove('hidden');
      if (tg && tg.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(closeCartSheet);
      }
    }

    function closeCartSheet() {
      triggerHaptic('light');
      document.getElementById('cartSheet').classList.add('hidden');
      if (tg && tg.BackButton) tg.BackButton.hide();
    }

    function handleMainButtonClick() {
      triggerHaptic('success');
      const note = document.getElementById('orderNote').value;
      const subtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
      const total = subtotal + 35;

      const orderPayload = {
        user: tg?.initDataUnsafe?.user || { name: 'Guest' },
        items: cart,
        total: total,
        note: note
      };

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(orderPayload));
      } else if (tg && tg.showAlert) {
        tg.showAlert(`🎉 Order Submitted!\nTotal: $${total.toFixed(2)}\nItems: ${cart.length}`);
      } else {
        alert(`Order Placed! Total: $${total}`);
      }

      cart = [];
      updateCartUI();
      closeCartSheet();
    }
  </script>
</body>
</html>
